<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect Queue</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f3;--bg3:#eeece6;--tx:#1a1a18;--tx2:#6b6b67;--bd:rgba(0,0,0,0.12);--bd2:rgba(0,0,0,0.22);--ff:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--rm:8px;--rl:12px}
@media(prefers-color-scheme:dark){:root{--bg:#1e1e1c;--bg2:#2a2a28;--bg3:#111110;--tx:#f0ede6;--tx2:#9a9893;--bd:rgba(255,255,255,0.1);--bd2:rgba(255,255,255,0.18)}}
body{font-family:var(--ff);color:var(--tx);background:var(--bg3);font-size:14px;min-height:100vh}
.page{max-width:1100px;margin:0 auto;padding:1.5rem 1rem}
h1{font-size:18px;font-weight:500;margin-bottom:1.5rem}
.tabs{display:flex;gap:2px;border-bottom:0.5px solid var(--bd);margin-bottom:1.5rem;overflow-x:auto}
.tab{padding:8px 13px;border:none;background:none;color:var(--tx2);cursor:pointer;font-size:13px;border-bottom:2px solid transparent;margin-bottom:-0.5px;white-space:nowrap;flex-shrink:0}
.tab.active{color:var(--tx);border-bottom-color:var(--tx);font-weight:500}
.tab:hover:not(.active){color:var(--tx)}
.panel{display:none}.panel.active{display:block}
.wh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:1rem;flex-wrap:wrap;gap:10px}
.wm h2{font-size:16px;font-weight:500;margin-bottom:3px}
.wm p{font-size:12px;color:var(--tx2)}
.stats{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{background:var(--bg2);border-radius:var(--rm);padding:8px 12px;text-align:center;min-width:56px}
.stat .n{font-size:20px;font-weight:500;line-height:1}
.stat .l{font-size:11px;color:var(--tx2);margin-top:2px}
.clist{display:flex;flex-direction:column;gap:6px}
.card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:11px 13px}
.card.done{opacity:0.5}
.ci{display:flex;align-items:flex-start}
.ct{display:flex;align-items:center;gap:9px}
.av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;flex-shrink:0}
.cn{font-weight:500;font-size:14px}
.cm{font-size:11px;color:var(--tx2);margin-top:2px}
.bdgs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 0 43px}
.badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500}
.lr{display:flex;gap:6px;margin:8px 0 0 43px;flex-wrap:wrap;align-items:center}
.lr select{font-size:12px;padding:4px 7px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);flex:1;min-width:140px}
.dl{margin:4px 0 0 43px;font-size:12px;color:var(--tx2)}
.sc{font-size:12px;font-weight:500;color:var(--tx2);white-space:nowrap;margin-left:auto;padding-left:10px;text-align:right}
.sc .sc-total{font-size:15px;font-weight:600;color:var(--tx)}
.sc .sc-breakdown{font-size:10px;color:var(--tx2);margin-top:2px}
.pinned{border-left:2px solid #185FA5;padding-left:11px;border-radius:0}
.overdue{border-left:2px solid #E24B4A;padding-left:11px;border-radius:0}
.manual-add{border-left:2px solid #0F6E56;padding-left:11px;border-radius:0}
.ob{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500;background:#FCEBEB;color:#791F1F}
.pb{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500;background:#E6F1FB;color:#0C447C}
.mb{font-size:10px;padding:1px 6px;border-radius:20px;font-weight:500;background:#E1F5EE;color:#085041}
@media(prefers-color-scheme:dark){.ob{background:#791F1F;color:#F7C1C1}.pb{background:#0C447C;color:#B5D4F4}.mb{background:#085041;color:#9FE1CB}}
.star-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;line-height:1;color:var(--tx2);flex-shrink:0}
.star-btn.on{color:#F5A623}
.star-btn:hover{color:#F5A623}
.punt-btn{font-size:11px;padding:3px 9px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx2);cursor:pointer}
.punt-btn:hover{color:var(--tx)}
.tb{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap;align-items:center}
.tb input,.tb select{font-size:13px;padding:6px 9px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx)}
.tb input{flex:1;min-width:140px}
.ctbl{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.ctbl th{text-align:left;padding:7px 9px;color:var(--tx2);font-weight:500;border-bottom:0.5px solid var(--bd);font-size:12px;white-space:nowrap;cursor:pointer;user-select:none}
.ctbl th:hover,.ctbl th.sa{color:var(--tx)}
.si{font-size:11px;margin-left:3px;opacity:0.5}.si.on{opacity:1}
.ctbl td{padding:7px 9px;border-bottom:0.5px solid var(--bd);vertical-align:middle;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctbl tr:last-child td{border-bottom:none}
.ctbl tr:hover td{background:var(--bg2)}
.sblock{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:1rem}
.sblock h3{font-size:13px;font-weight:500;margin-bottom:10px}
.etbl{width:100%;border-collapse:collapse;font-size:13px}
.etbl th{text-align:left;padding:6px 8px;font-size:11px;color:var(--tx2);font-weight:500;border-bottom:0.5px solid var(--bd)}
.etbl td{padding:4px 4px;border-bottom:0.5px solid var(--bd);vertical-align:middle}
.etbl tr:last-child td{border-bottom:none}
.etbl input[type=text],.etbl input[type=number]{width:100%;padding:5px 8px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);font-size:13px;font-family:inherit}
.etbl input[type=number]{text-align:right}
.etbl select{width:100%;padding:5px 6px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);font-size:13px}
.ibtn{padding:4px 8px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);cursor:pointer;font-size:12px;white-space:nowrap}
.btn{padding:6px 12px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);cursor:pointer;font-size:13px}
.btnp{padding:6px 12px;border-radius:var(--rm);border:0.5px solid var(--tx);background:var(--tx);color:var(--bg);cursor:pointer;font-size:13px}
.btnsm{padding:4px 10px;font-size:12px}
.btnadd{padding:3px 9px;border-radius:var(--rm);border:0.5px solid #0F6E56;background:transparent;color:#0F6E56;cursor:pointer;font-size:12px;white-space:nowrap}
.btnadd:hover{background:#E1F5EE}
.btnadd.added{background:#E1F5EE;color:#085041;border-color:#085041}
.addrow{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.addrow input[type=text]{flex:1;min-width:120px;padding:6px 9px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);font-size:13px;font-family:inherit}
.addrow input[type=number]{width:64px;flex-shrink:0;padding:6px 9px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);font-size:13px;text-align:right;font-family:inherit}
.save-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ff{display:flex;flex-direction:column;gap:3px}
.ff label{font-size:11px;color:var(--tx2)}
.ff input,.ff select{padding:6px 9px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);font-size:13px;font-family:inherit}
.ff .hint{font-size:11px;color:var(--tx2)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.full{grid-column:1/-1}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:var(--bg);border-radius:var(--rl);border:0.5px solid var(--bd2);padding:1.25rem;width:92%;max-width:500px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:15px;font-weight:500;margin-bottom:1rem}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.hitem{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 11px;background:var(--bg2);border-radius:var(--rm);margin-bottom:5px}
.hpts{font-weight:500;color:#0F6E56;min-width:28px;text-align:right}
.hdate{color:var(--tx2);font-size:11px;margin-left:auto}
.wlog{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:10px}
.wlog-hdr{display:flex;justify-content:space-between;align-items:center;cursor:pointer;user-select:none}
.wlog-hdr h4{font-size:14px;font-weight:500}
.wpts{font-size:13px;color:#0F6E56;font-weight:500}
.wlog-body{margin-top:10px;border-top:0.5px solid var(--bd);padding-top:10px;display:none}
.wlog-body.open{display:block}
.csv-zone{border:1.5px dashed var(--bd2);border-radius:var(--rl);padding:1.5rem;text-align:center;margin-bottom:1rem;cursor:pointer;transition:background 0.15s}
.csv-zone:hover{background:var(--bg2)}
.csv-zone p{font-size:13px;color:var(--tx2);margin-top:6px}
.csv-preview{font-size:12px;color:var(--tx2);margin-top:8px;max-height:120px;overflow-y:auto}
.csv-preview table{width:100%;border-collapse:collapse}
.csv-preview td,.csv-preview th{padding:3px 6px;border-bottom:0.5px solid var(--bd);text-align:left}
.csv-preview th{font-weight:500;color:var(--tx)}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.map-item{display:flex;flex-direction:column;gap:3px}
.map-item label{font-size:11px;color:var(--tx2)}
.map-item select{padding:5px 7px;border-radius:var(--rm);border:0.5px solid var(--bd2);background:var(--bg2);color:var(--tx);font-size:13px}
.notice{font-size:12px;padding:8px 12px;border-radius:var(--rm);margin-bottom:10px}
.notice.info{background:#E6F1FB;color:#0C447C}
.notice.warn{background:#FAEEDA;color:#633806}
.notice.ok{background:#EAF3DE;color:#27500A}
.empty{text-align:center;padding:2rem;color:var(--tx2);font-size:13px}
.pts-tag{font-size:11px;color:#0F6E56;font-weight:500}
.slbl{font-size:11px;font-weight:500;color:var(--tx2);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
.divider-row{display:flex;align-items:center;gap:10px;margin:1.25rem 0 10px;cursor:pointer}
.divider-row .dline{flex:1;height:0.5px;background:var(--bd)}
.divider-row .dlabel{font-size:12px;font-weight:500;color:var(--tx2);white-space:nowrap;user-select:none}
</style>
</head>
<body>
<div class="page">
<h1><i class="ti ti-users"></i> Connect Queue</h1>
<div id="scorebar" style="background:var(--bg2);border:0.5px solid var(--bd);border-radius:var(--rm);padding:10px 16px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 20px;font-size:13px;"></div>
<div class="tabs">
  <button class="tab active" onclick="showTab('weekly')">This Week</button>
  <button class="tab" onclick="showTab('contacts')">Contacts</button>
  <button class="tab" onclick="showTab('import')">Import CSV</button>
  <button class="tab" onclick="showTab('history')">Log</button>
  <button class="tab" onclick="showTab('settings')">Settings</button>
</div>
<div id="tab-weekly" class="panel active"></div>
<div id="tab-contacts" class="panel"></div>
<div id="tab-import" class="panel"></div>
<div id="tab-history" class="panel"></div>
<div id="tab-settings" class="panel"></div>
</div>
<div id="mc"></div>
<script>/* Connect Queue v8 — log modal + backdating + wider layout */

const DA=[
  {id:'a1',label:'Email',pts:1},{id:'a2',label:'Voicemail',pts:1},{id:'a3',label:'Text',pts:1},
  {id:'a4',label:'LinkedIn',pts:1},{id:'a5',label:'Other',pts:1},{id:'a6',label:'Call Held',pts:2},
  {id:'a7',label:'In-Person Meeting',pts:4},{id:'a8',label:'Ask for Referral',pts:3},
  {id:'a9',label:'Give Referral',pts:4},{id:'a10',label:'Meaningful Introduction',pts:3},
  {id:'a11',label:'Session Day / VTH',pts:5},{id:'a12',label:'90-Minute Meeting',pts:5},
  {id:'a13',label:'Session Booked',pts:6}
];
const DT=[
  {id:'lead',label:'Lead',boost:70,cadence:14,color:'coral'},
  {id:'active-client',label:'Active Client',boost:50,cadence:35,color:'teal'},
  {id:'connector',label:'Connector',boost:40,cadence:30,color:'purple'},
  {id:'former-client',label:'Former Client',boost:20,cadence:90,color:'amber'},
  {id:'colleague',label:'Colleague',boost:20,cadence:60,color:'blue'},
  {id:'other',label:'Other',boost:0,cadence:90,color:'gray'},
];
const DP=[{id:'high',label:'High',boost:10},{id:'medium',label:'Medium',boost:5},{id:'low',label:'Low',boost:0}];
const DS=[
  {id:'nurturing',label:'Nurturing'},{id:'vth-scheduled',label:'VTH Scheduled'},
  {id:'vth-held',label:'VTH Held'},{id:'90min-scheduled',label:'90-Min Scheduled'},
  {id:'90min-held',label:'90-Min Held'},{id:'converted',label:'Converted'},
];
const COLOR_OPTIONS=['coral','teal','purple','blue','gray','amber','green','pink'];
const DSB=[
  {id:'sb1',daysFrom:0,daysTo:6,pts:40},
  {id:'sb2',daysFrom:7,daysTo:14,pts:30},
  {id:'sb3',daysFrom:15,daysTo:20,pts:20},
  {id:'sb4',daysFrom:21,daysTo:28,pts:10},
];
const COLS={
  coral:{bg:'#FAECE7',tx:'#712B13'},teal:{bg:'#E1F5EE',tx:'#085041'},
  purple:{bg:'#EEEDFE',tx:'#3C3489'},blue:{bg:'#E6F1FB',tx:'#0C447C'},
  gray:{bg:'#F1EFE8',tx:'#444441'},amber:{bg:'#FAEEDA',tx:'#633806'},
  green:{bg:'#EAF3DE',tx:'#27500A'},pink:{bg:'#FBEAF0',tx:'#72243E'},
};
let SC='score',SD='desc';
let csvRows=[],csvHeaders=[];

function rd(k,d){try{const v=localStorage.getItem(k);if(!v)return d;return JSON.parse(v);}catch(e){return d;}}
function wr(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
function gA(){const r=rd('rp6_actions',null);if(!r||!Array.isArray(r)||!r.length||typeof r[0].label!=='string'||!r[0].label)return DA;return r;}
function gT(){return rd('rp6_types',DT);}
function gP(){return rd('rp6_priority',DP);}
function gS(){return rd('rp6_stages',DS);}
function gC(){return rd('rp6_contacts',[]);}
function gH(){return rd('rp6_hist',[]);}
function gW(){return rd('rp6_weekly',[]);}
function gPunted(){return rd('rp6_punted_ids',[]);}
function gWkSt(){return rd('rp6_wkst',{pts:0,done:0,weekStart:curWkStart()});}
function gWkLog(){return rd('rp6_wklog',[]);}
function gThresh(){return rd('rp6_thresh',65);}
function gSB(){return rd('rp6_session_boosts',DSB);}

function ds(d){if(!d)return 999;var parts=d.split('-');var local=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));return Math.floor((Date.now()-local)/86400000);}
function td(){return new Date().toISOString().split('T')[0];}
function curWkStart(){
  const n=new Date(),dy=n.getDay();
  const m=new Date(n);m.setDate(n.getDate()-(dy===0?6:dy-1));
  m.setHours(0,0,0,0);return m.toISOString().split('T')[0];
}
function wkLabel(){
  const ws=new Date(curWkStart()+'T00:00:00'),we=new Date(ws);we.setDate(ws.getDate()+6);
  const f=x=>x.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return f(ws)+' – '+f(we);
}
function wkLabelFrom(s){
  const ws=new Date(s+'T00:00:00'),we=new Date(ws);we.setDate(ws.getDate()+6);
  const f=x=>x.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  return f(ws)+' – '+f(we);
}
function isPinnedThisWeek(c){
  if(!c.followUpDate)return false;
  const d=new Date(c.followUpDate+'T00:00:00');
  const ws=new Date(curWkStart()+'T00:00:00');
  const we=new Date(ws);we.setDate(ws.getDate()+6);we.setHours(23,59,59,999);
  return d>=ws&&d<=we;
}

function calcScore(c){
  const types=gT(),priorities=gP();
  const type=types.find(t=>t.id===c.typeId)||types[0];
  const priority=priorities.find(p=>p.id===c.priorityId)||{boost:0};
  const typeBoost=type.boost||0;
  const priorityBoost=priority.boost||0;
  const cadence=type.cadence||90;
  const daysSince=ds(c.lastContact);
  const timeBoost=daysSince>=cadence?20:Math.round((daysSince/cadence)*20);
  // Session boost — days until next session
  var sessionBoost=0;
  if(c.zohoSession){
    var sp=c.zohoSession.split('-');
    var sDate=new Date(parseInt(sp[0]),parseInt(sp[1])-1,parseInt(sp[2]));
    var today=new Date();today.setHours(0,0,0,0);
    var daysUntil=Math.floor((sDate-today)/86400000);
    if(daysUntil>=0){
      var boosts=gSB();
      for(var i=0;i<boosts.length;i++){
        if(daysUntil>=boosts[i].daysFrom&&daysUntil<=boosts[i].daysTo){
          sessionBoost=boosts[i].pts;break;
        }
      }
    }
  }
  return {total:typeBoost+priorityBoost+timeBoost+sessionBoost,typeBoost,priorityBoost,timeBoost,sessionBoost};
}
function isOverdue(c){
  const types=gT();
  const type=types.find(t=>t.id===c.typeId)||types[0];
  return ds(c.lastContact)>=(type.cadence||90);
}
function dAgo(n){const d=new Date();d.setDate(d.getDate()-n);return d.toISOString().split('T')[0];}

function checkRollover(){
  const st=gWkSt(),cws=curWkStart();
  if(st.weekStart===cws)return;
  if(st.pts>0||st.done>0){
    const log=gWkLog();
    log.unshift({weekStart:st.weekStart,pts:st.pts,done:st.done,actions:gH().filter(h=>h.weekStart===st.weekStart)});
    if(log.length>52)log.pop();
    wr('rp6_wklog',log);
  }
  const contacts=gC();let changed=false;
  contacts.forEach(c=>{if(c.addedToWeek&&c.addedToWeek!==cws){c.addedToWeek='';changed=true;}});
  if(changed)wr('rp6_contacts',contacts);
  wr('rp6_wkst',{pts:0,done:0,weekStart:cws});
  wr('rp6_punted_ids',[]);
  genWeekly();
}

function hasUpcomingSession(c){
  if(!c.zohoSession)return false;
  var parts=c.zohoSession.split('-');
  if(parts.length<3)return false;
  var sessionDate=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  var today=new Date();today.setHours(0,0,0,0);
  var in4weeks=new Date(today.getTime()+28*24*60*60*1000);
  return sessionDate>=today&&sessionDate<=in4weeks;
}

function genWeekly(){
  const thresh=gThresh(),cws=curWkStart();
  const contacts=gC().filter(c=>!c.archived);
  const existing=gW();
  const exMap=Object.fromEntries(existing.map(w=>[w.id,w]));
  const puntedIds=new Set(gPunted());
  const selected=[];
  contacts.forEach(c=>{
    const {total}=calcScore(c);
    const pinned=isPinnedThisWeek(c);
    const manual=c.addedToWeek===cws;
    const aboveThresh=total>=thresh;
    const wasDone=exMap[c.id]?.done||false;
    if(puntedIds.has(c.id))return;
    const hasSession=hasUpcomingSession(c);
    if(pinned||manual||aboveThresh||wasDone){
      selected.push({
        id:c.id,
        done:exMap[c.id]?.done||false,
        action:exMap[c.id]?.action||'',
        pts:exMap[c.id]?.pts||0,
        pinned:exMap[c.id]?.pinned||pinned,
        manual:exMap[c.id]?.manual||manual,
        session:hasSession,
      });
    }
  });
  const cmap=Object.fromEntries(contacts.map(c=>[c.id,c]));
  selected.sort((a,b)=>{
    if(a.done&&!b.done)return 1;if(!a.done&&b.done)return -1;
    if(!a.done&&!b.done){
      var as=cmap[a.id]&&cmap[a.id].starred?1:0,bs=cmap[b.id]&&cmap[b.id].starred?1:0;
      if(bs-as!==0)return bs-as;
    }
    if(a.pinned&&!b.pinned)return -1;if(!a.pinned&&b.pinned)return 1;
    if(a.session&&!b.session)return -1;if(!a.session&&b.session)return 1;
    if(a.manual&&!b.manual)return -1;if(!a.manual&&b.manual)return 1;
    return calcScore(cmap[b.id]||{}).total - calcScore(cmap[a.id]||{}).total;
  });
  wr('rp6_weekly',selected);
}

function mkCard(w,contacts,types,priorities,stages,actions){
  const c=contacts.find(x=>x.id===w.id);if(!c)return'';
  const type=types.find(t=>t.id===c.typeId)||types[0];
  const priority=priorities.find(p=>p.id===c.priorityId);
  const stage=stages.find(s=>s.id===c.stageId);
  const {total,typeBoost,priorityBoost,timeBoost,sessionBoost}=calcScore(c);
  const od=!w.pinned&&isOverdue(c);
  const d=ds(c.lastContact);
  const dtxt=d===999?'never':d===0?'today':d===1?'yesterday':d+'d ago';
  const cl=COLS[type.color]||COLS.gray;
  const ini=c.name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
  const sug=suggestAction(c,type);
  const fud=c.followUpDate?new Date(c.followUpDate+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}):null;
  const priBg=c.priorityId==='high'?'#FAECE7':c.priorityId==='medium'?'#FAEEDA':'#F1EFE8';
  const priTx=c.priorityId==='high'?'#712B13':c.priorityId==='medium'?'#633806':'#444441';
  const starred=!!c.starred;
  const cardClass='card'+(w.done?' done':'')+(w.pinned?' pinned':w.manual?' manual-add':od?' overdue':'');
  const actionOpts=actions.map(a=>'<option value="'+a.pts+'" data-label="'+a.label+'">'+a.label+(a.pts>0?' (+'+a.pts+'pt)':'')+'</option>').join('');
  const starBtn='<button class="star-btn'+(starred?' on':'')+'" data-cid="'+c.id+'" onclick="toggleStar(this.dataset.cid)" title="'+(starred?'Unstar':'Star')+'">'+(starred?'\u2605':'\u2606')+'</button>';
  return '<div class="'+cardClass+'">'
    +'<div class="ci">'
    +'<div style="flex:1">'
    +'<div class="ct">'+starBtn+'<div class="av" style="background:'+cl.bg+';color:'+cl.tx+'">'+ini+'</div>'
    +'<div><div class="cn">'+c.name+'</div><div class="cm">Last contact: '+dtxt+(c.notes?' \xb7 '+c.notes:'')+'</div></div></div>'
    +'<div class="bdgs">'
    +'<span class="badge" style="background:'+cl.bg+';color:'+cl.tx+'">'+type.label+'</span>'
    +(priority?'<span class="badge" style="background:'+priBg+';color:'+priTx+'">'+priority.label+'</span>':'')
    +(stage?'<span class="badge" style="background:#EEEDFE;color:#3C3489">'+stage.label+'</span>':'')
    +(w.pinned?'<span class="pb"><i class="ti ti-calendar-pin" style="font-size:10px"></i> '+fud+'</span>':'')
    +(w.manual&&!w.pinned?'<span class="mb"><i class="ti ti-hand-finger" style="font-size:10px"></i> added manually</span>':'')
    +(od?'<span class="ob">overdue</span>':'')
    +(sug?'<span class="badge" style="background:#FBEAF0;color:#72243E;font-style:italic">try: '+sug+'</span>':'')
    +(c.zohoSession?'<span class="badge" style="background:#FFF3E0;color:#8B4513;font-weight:600"><i class="ti ti-calendar-event" style="font-size:10px"></i> Session '+fmtSessionDate(c.zohoSession)+(c.zohoSessionTime?' '+c.zohoSessionTime:'')+'</span>':'')
    +'</div>'
    +'<div class="lr">'
    +'<button onclick="openLogModal('+w.id+')" class="btnp btnsm"><i class="ti ti-edit"></i> Log action</button>'
    +'<button onclick="puntContact('+w.id+')" class="punt-btn">Punt</button>'
    +'<button onclick="openEditFromWeekly('+c.id+')" class="ibtn" title="Edit contact" style="margin-left:auto"><i class="ti ti-user-edit"></i></button>'
    +'</div>'
    +'</div>'
    +'<div class="sc"><div class="sc-total">'+total+'</div><div class="sc-breakdown">'+typeBoost+'+'+priorityBoost+'+'+timeBoost+(sessionBoost?'+<span style="color:#8B4513">'+sessionBoost+'</span>':'')+'</div></div>'
    +'</div></div>';
}

function suggestAction(c,type){
  if(type.id==='lead'){
    if(c.stageId==='vth-scheduled')return'Confirm VTH';
    if(c.stageId==='vth-held')return'Book 90-min';
    if(c.stageId==='90min-scheduled')return'Prep meeting';
    if(c.stageId==='90min-held')return'Follow up';
    return'Call';
  }
  if(type.id==='active-client')return'Check-in call';
  if(type.id==='connector')return'Give referral';
  if(type.id==='former-client')return'Reconnect';
  return null;
}

function saveLogModal(weeklyId){
  var sel=document.getElementById('log-action-sel');
  var datePicker=document.getElementById('log-date');
  var noteEl=document.getElementById('log-note');
  var actionNote=noteEl?noteEl.value.trim():'';
  if(!sel||!sel.value)return;
  var pts=parseInt(sel.value);
  var label=sel.options[sel.selectedIndex].dataset.label;
  var logDate=datePicker?datePicker.value:td();
  if(!logDate)logDate=td();

  // Calculate which week this date belongs to
  var parts=logDate.split('-');
  var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  var day=d.getDay();
  var mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));mon.setHours(0,0,0,0);
  var logWeekStart=mon.toISOString().split('T')[0];
  var isThisWeek=logWeekStart===curWkStart();
  var displayDate=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});

  // If logging from a weekly card, mark it done in the weekly list
  var wid=weeklyId!=='null'&&weeklyId?parseInt(weeklyId):null;
  var contacts=gC();
  var cid=null;
  var contactName='';

  if(wid!==null){
    var weekly=gW();
    var wi=weekly.findIndex(function(w){return w.id===wid;});
    if(wi>=0){
      cid=weekly[wi].id;
      weekly[wi]={id:cid,done:true,action:label,pts:pts,pinned:weekly[wi].pinned,manual:weekly[wi].manual};
      wr('rp6_weekly',weekly);
    }
  }

  // Find contact to update lastContact
  if(cid===null){
    // Shouldn't happen from This Week flow, but guard
    closeModal();return;
  }
  var ci=contacts.findIndex(function(c){return c.id===cid;});
  if(ci>=0){
    contactName=contacts[ci].name;
    // Only update lastContact if this date is >= current lastContact
    var prevDate=contacts[ci].lastContact||'';
    if(!prevDate||logDate>=prevDate){
      contacts[ci].lastContact=logDate;
      contacts[ci].followUpDate='';
    }
    wr('rp6_contacts',contacts);
  }

  // Write to history with the correct weekStart
  var hist=gH();
  hist.unshift({hid:'h'+Date.now()+'_'+Math.random().toString(36).slice(2,6),cid:cid,name:contactName,action:label,note:actionNote,pts:pts,date:displayDate,isoDate:logDate,weekStart:logWeekStart});
  if(hist.length>500)hist.pop();
  wr('rp6_hist',hist);

  // Update tally — only if logging for current week
  if(isThisWeek){
    var st=gWkSt();
    wr('rp6_wkst',{pts:st.pts+pts,done:st.done+1,weekStart:st.weekStart});
  }

  closeModal();
  renderWeekly();
}

function setSC(col){if(SC===col){SD=SD==='asc'?'desc':'asc';}else{SC=col;SD=(col==='score'||col==='days')?'desc':'asc';}renderContacts();}
function sortC(contacts){
  return contacts.slice().sort(function(a,b){
    var av,bv;
    var types=gT();
    if(SC==='name'){av=a.name.toLowerCase();bv=b.name.toLowerCase();}
    else if(SC==='type'){var ta=types.find(t=>t.id===a.typeId),tb=types.find(t=>t.id===b.typeId);av=ta?ta.label:'';bv=tb?tb.label:'';}
    else if(SC==='priority'){var po={high:3,medium:2,low:1};av=po[a.priorityId]||0;bv=po[b.priorityId]||0;}
    else if(SC==='days'){av=ds(a.lastContact);bv=ds(b.lastContact);}
    else{av=calcScore(a).total;bv=calcScore(b).total;}
    if(av<bv)return SD==='asc'?-1:1;if(av>bv)return SD==='asc'?1:-1;return 0;
  });
}
function thI(col){
  if(SC!==col)return'<i class="ti ti-selector si"></i>';
  return SD==='asc'?'<i class="ti ti-sort-ascending si on"></i>':'<i class="ti ti-sort-descending si on"></i>';
}

function saveLogFromContacts(){
  var cid=window._logFromContactsCid;
  if(!cid)return;
  var sel=document.getElementById('log-action-sel');
  var datePicker=document.getElementById('log-date');
  var noteEl=document.getElementById('log-note');
  var actionNote=noteEl?noteEl.value.trim():'';
  if(!sel||!sel.value)return;
  var pts=parseInt(sel.value);
  var label=sel.options[sel.selectedIndex].dataset.label;
  var logDate=datePicker?datePicker.value:td();
  if(!logDate)logDate=td();
  // Determine week
  var parts=logDate.split('-');
  var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  var day=d.getDay();
  var mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));mon.setHours(0,0,0,0);
  var logWeekStart=mon.toISOString().split('T')[0];
  var isThisWeek=logWeekStart===curWkStart();
  var displayDate=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  // Update contact lastContact if logDate is newer
  var contacts=gC();
  var ci=contacts.findIndex(function(c){return c.id===cid;});
  var contactName='';
  if(ci>=0){
    contactName=contacts[ci].name;
    var prevDate=contacts[ci].lastContact||'';
    if(!prevDate||logDate>=prevDate){contacts[ci].lastContact=logDate;}
    wr('rp6_contacts',contacts);
  }
  // Write history
  var hist=gH();
  hist.unshift({hid:'h'+Date.now()+'_'+Math.random().toString(36).slice(2,6),cid:cid,name:contactName,action:label,note:actionNote,pts:pts,date:displayDate,isoDate:logDate,weekStart:logWeekStart});
  if(hist.length>500)hist.pop();
  wr('rp6_hist',hist);
  // Update tally — pts AND done for current week
  if(isThisWeek){
    var st=gWkSt();
    wr('rp6_wkst',{pts:st.pts+pts,done:st.done+1,weekStart:st.weekStart});
  }
  window._logFromContactsCid=null;
  closeModal();
  renderContacts();
}

function exportCSV(){
  var contacts=gC(),types=gT(),priorities=gP(),stages=gS();

function processCSVFile(file){var r=new FileReader();r.onload=function(e){parseCSV(e.target.result);};r.readAsText(file);}
function parseCSV(text){
  var lines=text.split(/\r?\n/).filter(function(l){return l.trim();});
  if(lines.length<2){showCSVError('File appears empty.');return;}
  function pr(row){var res=[],cur='',inQ=false;for(var i=0;i<row.length;i++){var ch=row[i];if(ch==='"'){if(inQ&&row[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}else if(ch===','&&!inQ){res.push(cur.trim());cur='';}else cur+=ch;}res.push(cur.trim());return res;}
  csvHeaders=pr(lines[0]);
  csvRows=lines.slice(1).map(pr).filter(function(r){return r.some(function(c){return c;});});
  if(!csvRows.length){showCSVError('No data rows found.');return;}
  document.getElementById('csv-feedback').innerHTML='<div class="notice ok"><i class="ti ti-check"></i> Found '+csvRows.length+' rows and '+csvHeaders.length+' columns.</div>';
  document.getElementById('csv-mapping').style.display='block';
  populateMapSelects();showCSVPreview();
}

  var opts='<option value="">— skip —</option>'+csvHeaders.map(function(h,i){return'<option value="'+i+'">'+h+'</option>';}).join('');
  Object.keys(am).forEach(function(fid){

function normalizeType(val,types){
  if(!val)return null;var v=val.toLowerCase().trim();
  var exact=types.find(function(t){return t.label.toLowerCase()===v;});if(exact)return exact.id;
  var partial=types.find(function(t){return t.label.toLowerCase().indexOf(v)>=0||v.indexOf(t.label.toLowerCase().split(' ')[0])>=0;});if(partial)return partial.id;
  var map={lead:'lead','warm lead':'lead',prospect:'lead',client:'active-client','active client':'active-client','current client':'active-client',connector:'connector','a-list':'connector','b-list':'connector','c-list':'connector',colleague:'colleague',peer:'colleague',former:'former-client','former client':'former-client','past client':'former-client'};
  return map[v]||null;
}
function normalizePriority(val){if(!val)return'';var v=val.toLowerCase().trim();if(v==='high'||v==='h'||v==='3'||v==='a')return'high';if(v==='medium'||v==='med'||v==='m'||v==='2'||v==='b')return'medium';if(v==='low'||v==='l'||v==='1'||v==='c')return'low';return'';}
function normalizeDate(val){if(!val)return'';var d=new Date(val.trim());if(!isNaN(d.getTime()))return d.toISOString().split('T')[0];return'';}
function runImport(){

  var newIsoDate=datePicker?datePicker.value:'';
  var hist=gH();
  var h=hist[idx];if(!h)return;
  var oldPts=h.pts;
  var oldWeekStart=h.weekStart;
  var cws=curWkStart();
  var wasCurrWeek=oldWeekStart===cws;

  // Recalculate weekStart if date changed
  var newWeekStart=oldWeekStart;
  var newDisplayDate=h.date;
  if(newIsoDate&&newIsoDate!==h.isoDate){
    var parts=newIsoDate.split('-');
    var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
    var day=d.getDay();
    var mon=new Date(d);mon.setDate(d.getDate()-(day===0?6:day-1));mon.setHours(0,0,0,0);
    newWeekStart=mon.toISOString().split('T')[0];
    newDisplayDate=d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  }
  var isNowCurrWeek=newWeekStart===cws;
  var dateChanged=newWeekStart!==oldWeekStart;

  // Save updated entry
  var updatedEntry=Object.assign({},h,{action:newLabel,pts:newPts,isoDate:newIsoDate||h.isoDate,date:newDisplayDate,weekStart:newWeekStart,note:actionNote!==null?actionNote:h.note});
  hist[idx]=updatedEntry;
  wr('rp6_hist',hist);

  // Adjust current-week live tally
  var st=gWkSt();
  var ptsDelta=(isNowCurrWeek?newPts:0)-(wasCurrWeek?oldPts:0);
  var doneDelta=(isNowCurrWeek&&!wasCurrWeek)?1:((!isNowCurrWeek&&wasCurrWeek)?-1:0);
  if(ptsDelta!==0||doneDelta!==0){
    wr('rp6_wkst',{pts:Math.max(0,st.pts+ptsDelta),done:Math.max(0,st.done+doneDelta),weekStart:cws});
  }

  // Update past-week archives if the week changed or action/pts changed for a past week
  if(!isNowCurrWeek||!wasCurrWeek||dateChanged){
    var wklog=gWkLog();
    // Remove old entry from old week archive (if past week)
    if(!wasCurrWeek&&oldWeekStart){
      var oldWkIdx=wklog.findIndex(function(w){return w.weekStart===oldWeekStart;});
      if(oldWkIdx>=0){
        wklog[oldWkIdx].pts=Math.max(0,wklog[oldWkIdx].pts-oldPts);
        wklog[oldWkIdx].actions=(wklog[oldWkIdx].actions||[]).filter(function(a){return a.hid!==h.hid;});
      }
    }
    // Add/update in new week archive (if past week)
    if(!isNowCurrWeek&&newWeekStart){
      var newWkIdx=wklog.findIndex(function(w){return w.weekStart===newWeekStart;});
      if(newWkIdx>=0){
        // Update existing archive entry
        wklog[newWkIdx].pts=(wklog[newWkIdx].pts||0)+newPts;
        wklog[newWkIdx].done=(wklog[newWkIdx].done||0)+(dateChanged?1:0);
        var existingActionIdx=(wklog[newWkIdx].actions||[]).findIndex(function(a){return a.hid===h.hid;});
        if(existingActionIdx>=0){
          wklog[newWkIdx].actions[existingActionIdx]=updatedEntry;
        } else {
          wklog[newWkIdx].actions=(wklog[newWkIdx].actions||[]).concat([updatedEntry]);
        }
      } else {
        // Create a new archive entry for this past week
        wklog.push({weekStart:newWeekStart,pts:newPts,done:1,actions:[updatedEntry]});
        wklog.sort(function(a,b){return b.weekStart.localeCompare(a.weekStart);});
      }
    }
    wr('rp6_wklog',wklog);
  }

  closeModal();
  renderHistory();
  renderWeekly();
}

function deleteLogEntry(hid){
  var hist=gH();
  var idx=hist.findIndex(function(h){return h.hid===hid;});
  if(idx<0&&!isNaN(parseInt(hid)))idx=parseInt(hid);
  var h=hist[idx];if(!h)return;
  if(!confirm('Delete this log entry?\n'+h.name+' — '+h.action))return;
  var wasCurrWeek=h.weekStart===curWkStart();
  hist.splice(idx,1);
  wr('rp6_hist',hist);
  if(wasCurrWeek){
    var st=gWkSt();
    var newPts=Math.max(0,st.pts-h.pts);
    var otherEntries=hist.filter(function(e){return e.cid===h.cid&&e.weekStart===curWkStart();});
    var newDone=otherEntries.length>0?st.done:Math.max(0,st.done-1);
    wr('rp6_wkst',{pts:newPts,done:newDone,weekStart:st.weekStart});
    if(otherEntries.length===0){
      var weekly=gW();
      var wi=weekly.findIndex(function(w){return w.id===h.cid;});
      if(wi>=0){weekly[wi].done=false;weekly[wi].action='';weekly[wi].pts=0;wr('rp6_weekly',weekly);}
    }
  }
  renderHistory();
  renderWeekly();
}

var BACKUP_KEYS=['rp6_contacts','rp6_weekly','rp6_hist','rp6_wkst','rp6_wklog','rp6_types','rp6_priority','rp6_stages','rp6_actions','rp6_nextId','rp6_thresh','rp6_punted_ids','rp6_session_boosts'];

function exportBackup(){
  var backup={version:'cq1',exported:new Date().toISOString(),data:{}};
  BACKUP_KEYS.forEach(function(k){
    var v=localStorage.getItem(k);
    if(v!==null)backup.data[k]=JSON.parse(v);
  });
  var blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  var d=new Date();
  a.download='connect-queue-backup-'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
  a.click();
  URL.revokeObjectURL(a.href);
}

function importBackup(evt){
  var file=evt.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var backup=JSON.parse(e.target.result);
      if(!backup.data||!backup.data.rp6_contacts){
        alert('This does not look like a valid Connect Queue backup file.');return;
      }
      if(!confirm('This will REPLACE all your current data with the backup.\n\nExported: '+(backup.exported||'unknown')+'\n\nAre you sure?'))return;
      BACKUP_KEYS.forEach(function(k){
        if(backup.data[k]!==undefined){localStorage.setItem(k,JSON.stringify(backup.data[k]));}
      });
      alert('Backup restored successfully!');
      location.reload();
    }catch(err){
      alert('Could not read backup file: '+err.message);
    }
  };
  reader.readAsText(file);
  evt.target.value='';
}

function showTab(name){

function fmtSessionDate(iso){
  if(!iso)return'';
  var parts=iso.split('-');
  if(parts.length<3)return iso;
  var d=new Date(parseInt(parts[0]),parseInt(parts[1])-1,parseInt(parts[2]));
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

// ── Zoho CRM Integration ──────────────────────────────────────────────────
var ZOHO_REDIRECT=location.origin+location.pathname;
var ZOHO_SCOPE='ZohoCRM.modules.Accounts.READ';
var ZOHO_DEFAULT_CLIENT_ID='1000.9AZA69BZBAFS2ZHNJX4KLAVN49E0OE';

function zohoConnect(){
  var clientId=(document.getElementById('zoho-client-id')||{}).value||localStorage.getItem('rp6_zoho_client_id')||ZOHO_DEFAULT_CLIENT_ID;
  clientId=clientId.trim();
  if(!clientId){alert('Please enter your Zoho Client ID first.');return;}
  localStorage.setItem('rp6_zoho_client_id',clientId);

  // Implicit flow for client-based apps — token returned directly in URL hash
  var params=new URLSearchParams({
    response_type:'token',
    client_id:clientId,
    scope:ZOHO_SCOPE,
    redirect_uri:ZOHO_REDIRECT,
    prompt:'consent'
  });
  localStorage.setItem('rp6_zoho_pending_auth','1');
  window.location.href='https://accounts.zoho.com/oauth/v2/auth?'+params.toString();
}

function generateCodeVerifier(){
  var array=new Uint8Array(32);
  crypto.getRandomValues(array);
  return btoa(String.fromCharCode.apply(null,array)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
}

function generateCodeChallenge(verifier){
  var encoder=new TextEncoder();
  var data=encoder.encode(verifier);
  return crypto.subtle.digest('SHA-256',data).then(function(hash){
    return btoa(String.fromCharCode.apply(null,new Uint8Array(hash))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,'');
  });
}

function zohoExchangeCode(code){
  var clientId=localStorage.getItem('rp6_zoho_client_id')||'';
  var verifier=localStorage.getItem('rp6_zoho_verifier')||'';
  localStorage.removeItem('rp6_zoho_pending_auth');
  localStorage.removeItem('rp6_zoho_verifier');

  // Zoho PKCE token exchange
  var params=new URLSearchParams({
    grant_type:'authorization_code',
    client_id:clientId,
    redirect_uri:ZOHO_REDIRECT,
    code:code,
    code_verifier:verifier
  });

  fetch('https://accounts.zoho.com/oauth/v2/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:params.toString()
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.access_token){
      localStorage.setItem('rp6_zoho_access_token',data.access_token);
      if(data.refresh_token)localStorage.setItem('rp6_zoho_refresh_token',data.refresh_token);
      // Clean URL then sync
      window.history.replaceState({},'',ZOHO_REDIRECT);
      showTab('settings');
      setTimeout(function(){zohoSync();},400);
    } else {
      alert('Zoho auth failed: '+(data.error||JSON.stringify(data))+'\n\nNote: Zoho\'s PKCE flow may require the app to be set up as "Client-based Application" in the API Console. See instructions below.');
      window.history.replaceState({},'',ZOHO_REDIRECT);
      showTab('settings');
    }
  })
  .catch(function(err){
    alert('Token exchange error: '+err.message);
    window.history.replaceState({},'',ZOHO_REDIRECT);
  });
}

function zohoRefreshToken(){
  var clientId=localStorage.getItem('rp6_zoho_client_id')||'';
  var refreshToken=localStorage.getItem('rp6_zoho_refresh_token')||'';
  if(!refreshToken)return Promise.reject('No refresh token');
  var params=new URLSearchParams({
    grant_type:'refresh_token',
    client_id:clientId,
    refresh_token:refreshToken
  });
  return fetch('https://accounts.zoho.com/oauth/v2/token',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:params.toString()
  })
  .then(function(r){return r.json();})
  .then(function(data){
    if(data.access_token){
      localStorage.setItem('rp6_zoho_access_token',data.access_token);
      return data.access_token;
    }
    throw new Error(data.error||'Refresh failed');
  });
}

function zohoSync(){
  var token=localStorage.getItem('rp6_zoho_access_token');
  if(!token){alert('Not connected to Zoho. Please connect first.');return;}
  var statusEl=document.getElementById('zoho-sync-status');
  var btnEl=document.getElementById('zoho-sync-btn');
  localStorage.setItem('rp6_zoho_last_msg','Syncing…');
  if(statusEl)statusEl.textContent='Syncing…';
  if(btnEl)btnEl.disabled=true;

  var url='https://www.zohoapis.com/crm/v3/Accounts?fields=Account_Name,Next_Session_Date,Next_Session_Time&per_page=200';

  function doFetch(accessToken){
    return fetch(url,{headers:{'Authorization':'Zoho-oauthtoken '+accessToken}})
    .then(function(r){
      if(r.status===401){
        return zohoRefreshToken().then(function(newToken){
          return fetch(url,{headers:{'Authorization':'Zoho-oauthtoken '+newToken}});
        });
      }
      if(r.status===204){return Promise.resolve({__status:204});}
      return r.json().then(function(j){j.__httpStatus=r.status;return j;});
    });
  }

  doFetch(token).then(function(data){
    if(btnEl)btnEl.disabled=false;
    if(data.__status===204||(!data.data&&(data.status_code===204||data.__httpStatus===204))){
      localStorage.setItem('rp6_zoho_last_sync',new Date().toISOString());
      var msg0='Sync complete — 0 sessions found in next 4 weeks. (Check that Next_Session_Date is set on your Clients in Zoho and dates fall within the next 28 days.)';
      localStorage.setItem('rp6_zoho_last_msg',msg0);
      applyZohoSessions([]);
      renderSettings();
      return;
    }
    if(!data.data){
      var msg=data.message||data.error||JSON.stringify(data).slice(0,200);
      if(statusEl)statusEl.textContent='Sync error: '+msg;
      return;
    }
    localStorage.setItem('rp6_zoho_last_sync',new Date().toISOString());
    var sessions=data.data.filter(function(r){return r.Next_Session_Date;}).map(function(r){
      return{name:(r.Account_Name||'').trim(),date:r.Next_Session_Date,time:r.Next_Session_Time||''};
    });
    applyZohoSessions(sessions);
    var count=sessions.length;
    var contacts=gC();
    var matched=contacts.filter(function(c){return c.zohoSession;}).length;
    var zohoNames=sessions.map(function(s){return s.name;}).join(', ');
    var syncMsg='Sync complete — '+count+' session'+(count===1?'':'s')+' from Zoho ('+zohoNames+'), '+matched+' contact'+(matched===1?'':'s')+' matched in Connect Queue.';
    localStorage.setItem('rp6_zoho_last_msg',syncMsg);
    renderSettings();
  }).catch(function(err){
    if(btnEl)btnEl.disabled=false;
    var errMsg='Error: '+err.message;
    localStorage.setItem('rp6_zoho_last_msg',errMsg);
    renderSettings();
  });
}

function applyZohoSessions(sessions){
  // Store the session list
  localStorage.setItem('rp6_zoho_sessions',JSON.stringify(sessions));
  // Match against contacts by name (case-insensitive)
  var contacts=gC();
  var matched=0;
  contacts.forEach(function(c){
    var cname=(c.name||'').toLowerCase().trim();
    var match=sessions.find(function(s){return s.name.toLowerCase()===cname;});
    c.zohoSession=match?match.date:null;
    c.zohoSessionTime=match?match.time:null;
  });
  wr('rp6_contacts',contacts);
  matched=sessions.filter(function(s){
    return contacts.some(function(c){return (c.name||'').toLowerCase().trim()===s.name.toLowerCase();});
  }).length;
  console.log('Zoho sync: '+sessions.length+' sessions, '+matched+' matched contacts');
}

function zohoDisconnect(){
  if(!confirm('Disconnect from Zoho? Session sync data will be cleared.'))return;
  ['rp6_zoho_access_token','rp6_zoho_refresh_token','rp6_zoho_last_sync','rp6_zoho_sessions','rp6_zoho_verifier','rp6_zoho_pending_auth'].forEach(function(k){localStorage.removeItem(k);});
  var contacts=gC();
  contacts.forEach(function(c){delete c.zohoSession;delete c.zohoSessionTime;});
  wr('rp6_contacts',contacts);
  renderSettings();
}

// Check for Zoho OAuth callback on page load
(function(){
  // Implicit flow: token in URL hash
  var hash=window.location.hash;
  if(hash&&hash.indexOf('access_token')>=0){
    var hashParams=new URLSearchParams(hash.replace(/^#/,''));
    var token=hashParams.get('access_token');
    var expiresIn=hashParams.get('expires_in');
    if(token){
      localStorage.setItem('rp6_zoho_access_token',token);
      localStorage.removeItem('rp6_zoho_pending_auth');
      if(expiresIn){
        localStorage.setItem('rp6_zoho_token_expiry',Date.now()+parseInt(expiresIn)*1000);
      }
      window.history.replaceState({},'',ZOHO_REDIRECT);
      var returnTab=localStorage.getItem('rp6_zoho_return_tab')||'settings';
      localStorage.removeItem('rp6_zoho_return_tab');
      showTab(returnTab);
      setTimeout(function(){zohoSync();},400);
      return;
    }
  }
  // Auth code flow fallback
  var params=new URLSearchParams(window.location.search);
  var code=params.get('code');
  var pending=localStorage.getItem('rp6_zoho_pending_auth');
  if(code&&pending){
    zohoExchangeCode(code);
  }
})();
// Auto-sync Zoho on open if connected and stale (>23 hours) or token expired
function zohoAutoSync(){
  var token=localStorage.getItem('rp6_zoho_access_token');
  if(!token)return; // not connected, skip silently
  var expiry=parseInt(localStorage.getItem('rp6_zoho_token_expiry')||'0');
  var lastSync=localStorage.getItem('rp6_zoho_last_sync');
  var tokenExpired=expiry&&Date.now()>expiry;
  var syncStale=!lastSync||(Date.now()-new Date(lastSync).getTime())>23*60*60*1000;
  if(tokenExpired){
    // Token expired — redirect to re-auth silently
    localStorage.setItem('rp6_zoho_pending_auth','1');
    localStorage.setItem('rp6_zoho_return_tab','weekly');
    var clientId=localStorage.getItem('rp6_zoho_client_id')||ZOHO_DEFAULT_CLIENT_ID;
    var params=new URLSearchParams({response_type:'token',client_id:clientId,scope:ZOHO_SCOPE,redirect_uri:ZOHO_REDIRECT,prompt:'consent'});
    window.location.href='https://accounts.zoho.com/oauth/v2/auth?'+params.toString();
    return;
  }
  if(syncStale){
    // Token still valid, just re-sync quietly
    var today=new Date();
    var in4weeks=new Date(today.getTime()+28*24*60*60*1000);
    var fmt=function(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
    var criteria='(Next_Session_Date:between:'+fmt(today)+','+fmt(in4weeks)+')';
    var url='https://www.zohoapis.com/crm/v3/Accounts/search?criteria='+encodeURIComponent(criteria)+'&fields=Account_Name,Next_Session_Date,Next_Session_Time&per_page=200';
    fetch(url,{headers:{'Authorization':'Zoho-oauthtoken '+token}})
    .then(function(r){
      if(r.status===401){
        // Token actually expired — clear it so next open re-auths
        localStorage.removeItem('rp6_zoho_access_token');
        return null;
      }
      return r.json();
    })
    .then(function(data){
      if(!data)return;
      localStorage.setItem('rp6_zoho_last_sync',new Date().toISOString());
      var sessions=(data.data||[]).map(function(r){
        return{name:(r.Account_Name||'').trim(),date:r.Next_Session_Date,time:r.Next_Session_Time||''};
      });
      applyZohoSessions(sessions);
      genWeekly();
      renderWeekly();
    })
    .catch(function(){});// fail silently on auto-sync
  }
}
